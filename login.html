<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="main">
        <div class="photo">
            <div class="text">
                <h1>Welcome back!</h1>
                <h2 class="normal">Login to continue your learning journey.</h2>
            </div>
        </div>
        <div class="input">
        <div class="form">
        <div class="login">Login User</div>
        <div class="username">
            <div>User name</div>
            <input type="text" class="inp_user" placeholder="Type your username">
        </div>
        <div class="password">
            <div>Password</div>
            <input type="password" class="inp_pass" placeholder="Enter your password">

        </div>
        <div class="sign_up">Sign Up</div>
        <div class="register">Not an account?</div>
    </div>
        </div>
    </div>
</body>
<script src="login.js" defer></script>
</html>
