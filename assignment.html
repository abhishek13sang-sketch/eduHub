<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments</title>
    <link rel="stylesheet" href="assignment.css">
</head>
<body>
    <div class="main">
        <div class="details">
            <div class="logo">EduTask</div>
            <div class="dash"> ⌂ Dashboard</div>
            <div class="assignments">📄Assignments</div>
            <div class="logout"> ↩ Logout</div>
        </div>
        <div class="page">
            <div class="nav">
                <div class="text"><h1>Assignments</h1></div>
                <div class="profile">Welcome, Teacher <div class="profile-avatar">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="50">
                </div></div>
            </div>
            <div class="boxes">
                <h1>Create New Assignment</h1>
                <div class="title">
                    <p>Title</p>
                    <input class="inp_title" placeholder="Enter assignment title">
                </div>
                <div class="descrip">
                    <p>Description</p>
                    <textarea name="" id="descrip" placeholder="Enter assignment description"></textarea>
                </div>
                <div class="date">
                    <p>Deadline</p>
                    <input type="date" class="inp_date" placeholder="dd/mm/yyyy">
                </div>
                <div class="publish">
                    <button type="button">Publish Assignment</button>
                </div>
            </div>
        </div>
    </div>
    <script src="assignment.js"></script>
</body>
</html>
