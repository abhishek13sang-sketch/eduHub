<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="stylesheet" href="stu_submit.css">
</head>
<body>
<div class="assignment-page">

    <div class="top">
        <button id="backBtn">← Back to Assignments</button>
    </div>

    <div class="container">

        <div class="details">

            <div class="box">
                <h3>Title</h3>
                <p id="title"></p>
            </div>

            <div class="box">
                <h3>Description</h3>
                <p id="description"></p>
            </div>

            <div class="box small">
                <div>
                    <h4>Teacher</h4>
                    <p id="teacher"></p>
                </div>
                <div>
                    <h4>Deadline</h4>
                    <p id="deadline"></p>
                </div>
            </div>

        </div>

        <div class="submit">

            <div class="submit-box">
                <h3>Submit Assignment</h3>

                <input type="text" id="fileLink" placeholder="Paste your file link here">

                <button id="submitBtn">Submit</button>
            </div>

        </div>

    </div>

</div>
<script src="stu_submit.js"></script>
</body>
</html>
