<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review</title>
    <link rel="stylesheet" href="review_sub.css">
</head>
<body>
    <div class="nav">
        < Back to Submissions
    </div>
    <div class="main">
        <div class="left">
            <div class="text"><h1>Review Submission</h1></div>
            <div class="details">
                <div class="a">
                    <div>Teacher</div>
                    <div class="name"></div>
                </div>
                <div class="b">
                    <div>Submitted On</div>
                    <div class="date">dd/mm/yyyy</div>
                </div>
                <div class="c">
                    <div>Submission</div>
                    <div class="view">
                        <button>View File</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="marks" style="margin-bottom: 5px;">Marks</div>
            <input placeholder="Give marks">
            <div class="descrip">
                <p style="margin-bottom: 5px;">Description</p>
                <textarea name="" id="" placeholder="Enter assignment description"></textarea>
            </div>
            <div class="publish">
                <button>Submit Review</button>
            </div>
        </div>
    </div>
</body>
<script src="review_sub.js"></script>
</html>
